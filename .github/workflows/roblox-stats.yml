name: Mise à jour des statistiques Roblox

on:
  schedule:
    - cron: '7 * * * *'   # toutes les heures, à la minute 7
  workflow_dispatch:       # permet aussi de le lancer à la main (onglet Actions)

permissions:
  contents: write

concurrency:
  group: roblox-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Récupérer les statistiques
        run: node scripts/update-roblox-stats.mjs
      - name: Enregistrer si les chiffres ont changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/roblox-stats.json
          if git diff --cached --quiet; then
            echo "Rien à enregistrer."
          else
            git commit -m "Mise à jour des statistiques Roblox"
            git pull --rebase -q
            git push
          fi
